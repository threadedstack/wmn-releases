# The hosted editor (https://wmn.threadedstack.com, Firebase Hosting site wmn-editor-app of project wmn-runbooks) is deployed from here
# on GitHub Actions, so a wmn release never needs `firebase login` on the Mac that builds it. The release (scripts/release-steps.ts
# on that Mac) builds the site folder, uploads it as wmn-editor-site-<version>.tar.gz (+ .sha256) to the DRAFT release
# "editor-staging" of this repository, and dispatches this workflow by hand with the version and a stage:
#   preview  - deploys the site to the preview channel release-v<X-Y-Z> (7 days), after deleting old channels (the 2 newest
#              versions' release and before- channels stay), and puts the preview's address in editor-preview-url-<version>.txt on
#              editor-staging, which the release reads for its live check
#   promote  - keeps the live version as the channel before-release-v<X-Y-Z> (the first copy only), then makes the preview live
#   rollback - puts that kept version live again
# The Present site (https://present.threadedstack.com, Hosting site wmn-present-app of the same project), which the editor shows presented pages
# from, goes with it in every release (wmn-present-site-<version>.tar.gz), so the two always run the same version. Its preview channel is
# deployed first and its address is written into the editor's api/present ("preview"), so the editor's preview presents through it. Promote
# and rollback move both sites together: a failure on the second puts the first back.
# Firebase sign-in is keyless (Workload Identity Federation, as in the site repositories' Deploy workflows): pool "github" accepts
# threadedstack repositories, and gh-actions-deploy@wmn-runbooks needs the workloadIdentityUser binding for this repository.
name: Hosted editor

on:
  workflow_dispatch:
    inputs:
      version:
        description: "wmn version (for example 0.1.84)"
        required: true
      stage:
        description: "preview, promote or rollback"
        required: true
        type: choice
        options: [preview, promote, rollback]

permissions:
  contents: write
  id-token: write

concurrency:
  group: hosted-editor
  cancel-in-progress: false

env:
  SITE: wmn-editor-app
  PRESENT_SITE: wmn-present-app
  PROJECT: wmn-runbooks
  STAGING: editor-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Version and channel
        run: |
          v="${VERSION#v}"
          case "$v" in ''|*[!0-9.]*) echo "bad version: $VERSION" >&2; exit 1;; esac
          echo "V=$v" >> "$GITHUB_ENV"
          echo "CHANNEL=release-v${v//./-}" >> "$GITHUB_ENV"

      - name: Download and check the site (preview)
        if: ${{ inputs.stage == 'preview' }}
        run: |
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/dl"
          gh release download "$STAGING" --repo "$GITHUB_REPOSITORY" --pattern "wmn-editor-site-$V.tar.gz" --pattern "wmn-editor-site-$V.tar.gz.sha256" --clobber
          shasum -a 256 -c "wmn-editor-site-$V.tar.gz.sha256"
          tar -xzf "wmn-editor-site-$V.tar.gz" -C "$RUNNER_TEMP/site"
          gh release download "$STAGING" --repo "$GITHUB_REPOSITORY" --pattern "wmn-present-site-$V.tar.gz" --pattern "wmn-present-site-$V.tar.gz.sha256" --clobber
          shasum -a 256 -c "wmn-present-site-$V.tar.gz.sha256"
          mkdir -p "$RUNNER_TEMP/present"
          tar -xzf "wmn-present-site-$V.tar.gz" -C "$RUNNER_TEMP/present"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/79296749603/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-actions-deploy@wmn-runbooks.iam.gserviceaccount.com

      - run: npm install -g firebase-tools@15.16.0

      - name: Delete old channels (preview)
        if: ${{ inputs.stage == 'preview' }}
        working-directory: ${{ runner.temp }}/site
        run: |
          # each site's channels are capped (50): only the 2 newest versions' release and before- channels stay, and this version's own
          for site in "$SITE" "$PRESENT_SITE"; do
          firebase hosting:channel:list --site "$site" --json --project "$PROJECT" > "$RUNNER_TEMP/channels.json"
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync(process.env.RUNNER_TEMP + "/channels.json", "utf8");
            const names = (JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1)).result?.channels ?? [])
              .map((c) => (c.name ?? "").split("/").at(-1));
            const ver = (n) => /^(?:before-)?release-v(\d+)-(\d+)-(\d+)$/.exec(n)?.slice(1).map(Number);
            const key = (v) => v.map((x) => String(x).padStart(6, "0")).join(".");
            const versions = [...new Set(names.map(ver).filter(Boolean).map(key))].sort().reverse();
            const kept = new Set([...versions.slice(0, 2), key(ver(process.env.CHANNEL))]);
            console.log(names.filter((n) => ver(n) && !kept.has(key(ver(n)))).join("\n"));
          ' > "$RUNNER_TEMP/drop.txt"
          while read -r id; do
            [ -n "$id" ] && firebase hosting:channel:delete "$id" --site "$site" --force --project "$PROJECT"
          done < "$RUNNER_TEMP/drop.txt"
          done
          exit 0

      - name: Deploy the Present site's preview channel (preview)
        if: ${{ inputs.stage == 'preview' }}
        working-directory: ${{ runner.temp }}/present
        run: |
          firebase hosting:channel:deploy "$CHANNEL" --only "$PRESENT_SITE" --expires 7d --json --project "$PROJECT" > "$RUNNER_TEMP/present-deploy.json"
          cat "$RUNNER_TEMP/present-deploy.json"
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync(process.env.RUNNER_TEMP + "/present-deploy.json", "utf8");
            const j = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
            const url = j.result?.[process.env.PRESENT_SITE]?.url;
            if (!url) { console.error("the Present site channel deploy printed no url"); process.exit(1); }
            const p = process.env.RUNNER_TEMP + "/site/api/present";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.preview = new URL(url).origin;
            fs.writeFileSync(p, JSON.stringify(c) + "\n");
            console.log("the editor preview presents through " + c.preview);
          '

      - name: Deploy the preview channel
        if: ${{ inputs.stage == 'preview' }}
        working-directory: ${{ runner.temp }}/site
        run: |
          firebase hosting:channel:deploy "$CHANNEL" --only "$SITE" --expires 7d --json --project "$PROJECT" > "$RUNNER_TEMP/deploy.json"
          cat "$RUNNER_TEMP/deploy.json"
          url=$(node -e '
            const fs = require("fs");
            const t = fs.readFileSync(process.env.RUNNER_TEMP + "/deploy.json", "utf8");
            const j = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
            process.stdout.write(j.result?.[process.env.SITE]?.url ?? "");
          ')
          if [ -z "$url" ]; then echo "the preview channel deploy printed no url" >&2; exit 1; fi
          printf '%s' "$url" > "$RUNNER_TEMP/editor-preview-url-$V.txt"
          gh release upload "$STAGING" "$RUNNER_TEMP/editor-preview-url-$V.txt" --clobber --repo "$GITHUB_REPOSITORY"
          echo "preview: $url"

      - name: A Firebase folder (promote, rollback)
        if: ${{ inputs.stage != 'preview' }}
        # the firebase CLI refuses hosting commands outside a folder with a firebase.json; the site folder only exists for preview
        run: |
          mkdir -p "$RUNNER_TEMP/fb"
          printf '{"hosting":{"site":"%s","public":"."}}\n' "$SITE" > "$RUNNER_TEMP/fb/firebase.json"

      - name: Promote
        if: ${{ inputs.stage == 'promote' }}
        working-directory: ${{ runner.temp }}/fb
        run: |
          # both sites' preview channels must be there before either goes live
          for site in "$SITE" "$PRESENT_SITE"; do
            firebase hosting:channel:list --site "$site" --json --project "$PROJECT" > "$RUNNER_TEMP/channels-$site.json"
            if ! grep -q "/channels/$CHANNEL\"" "$RUNNER_TEMP/channels-$site.json"; then echo "$site has no channel $CHANNEL" >&2; exit 1; fi
          done
          # what is live now is kept on each site, so a rollback (or a failure below) can put it back
          for site in "$SITE" "$PRESENT_SITE"; do
            if grep -q "/channels/before-$CHANNEL\"" "$RUNNER_TEMP/channels-$site.json"; then
              echo "$site: before-$CHANNEL is kept already"
            else
              firebase hosting:clone "$site:live" "$site:before-$CHANNEL" --project "$PROJECT"
            fi
          done
          firebase hosting:clone "$PRESENT_SITE:$CHANNEL" "$PRESENT_SITE:live" --project "$PROJECT"
          if ! firebase hosting:clone "$SITE:$CHANNEL" "$SITE:live" --project "$PROJECT"; then
            echo "the editor did not go live: the Present site is put back so neither changed" >&2
            firebase hosting:clone "$PRESENT_SITE:before-$CHANNEL" "$PRESENT_SITE:live" --project "$PROJECT"
            exit 1
          fi

      - name: Roll back
        if: ${{ inputs.stage == 'rollback' }}
        working-directory: ${{ runner.temp }}/fb
        run: |
          # both sites go back; one that fails does not stop the other, and the step fails
          failed=0
          for site in "$SITE" "$PRESENT_SITE"; do
            firebase hosting:clone "$site:before-$CHANNEL" "$site:live" --project "$PROJECT" || { echo "$site did not go back" >&2; failed=1; }
          done
          exit $failed
