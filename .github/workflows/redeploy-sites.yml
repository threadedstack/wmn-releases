# When a wmn release is published here, every site built from it is rebuilt and redeployed by its own repository's Deploy
# workflow: this sends repository_dispatch "wmn-release" (with the version) to each of them. It first waits for the release's
# engine folder (wmn-engine-<version>.tar.gz), which the release uploads right after it publishes, since the sites build with it.
# A new site: add its repository to SITES; it needs a Deploy workflow that listens for "wmn-release".
name: Redeploy sites

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "wmn version to redeploy the sites with (for example 0.1.77)"
        required: true

permissions:
  contents: read

env:
  SITES: wmn-runbooks wmn-claude-code wmn-doom

jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the release's engine folder
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          v="${TAG#v}"
          for i in $(seq 1 100); do
            if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "wmn-engine-$v.tar.gz.sha256"; then
              echo "engine for $v is there"; echo "VERSION=$v" >> "$GITHUB_ENV"; exit 0
            fi
            sleep 30
          done
          echo "wmn-engine-$v.tar.gz never appeared on v$v" >&2; exit 1

      - name: Tell each site's repository to redeploy
        env:
          GH_TOKEN: ${{ secrets.SITES_DISPATCH_TOKEN }}
        run: |
          for repo in $SITES; do
            gh api "repos/threadedstack/$repo/dispatches" -f event_type=wmn-release -f "client_payload[version]=$VERSION"
            echo "sent wmn-release $VERSION to threadedstack/$repo"
          done
